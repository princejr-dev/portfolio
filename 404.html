<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PJr — 404 Not Found</title>

  <!-- FAVICON -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="favicon" type="image/x-icon" sizes="48x48" href="assets/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="192x192" href="assets/android-chrome-192x192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="assets/android-chrome-512x512.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#0F172A" />
  
  <!-- Links -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
}

    .error-page::before {
      content: '404';
      position: absolute;
      font-family: 'Syne', sans-serif;
      font-size: clamp(150px, 35vw, 300px);
      font-weight: 800;
      color: rgba(16, 185, 129, 0.04);
      pointer-events: none;
      user-select: none;
      line-height: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .error-inner {
      position: relative;
      z-index: 1;
      max-width: clamp(500px, 85vw, 1000px);
      width: 100%;
    }

    .error-code {
      font-family: 'Space Mono', monospace;
      font-size: clamp(10rem, 20vw, 15rem);
      font-weight: 700;
      color: #10B981;
      line-height: 1;
      margin-bottom: 81px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    .error-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 6vw, 15rem);
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.4s;
    }

    .error-sub {
      font-size: clamp(1rem, 2.5vw, 5rem);
      color: #94A3B8;
      line-height: 1.7;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.6s;
    }

    .error-sub span {
      font-family: 'Space Mono', monospace;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.8s;
    }

    .error-ring {
      width: clamp(300px, 18vw, 300px);
      height: clamp(300px, 18vw, 300px);
      margin-bottom: 40px;
      border-radius: 50%;
      border: 2px solid #10B981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      position: relative;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.1s;
    }

    .error-ring::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed rgba(16, 185, 129, 0.35);
      animation: spin 12s linear infinite;
    }

    .error-ring i {
      font-size: clamp(2.5rem, 6vw, 5rem);
      color: #10B981;
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 640px) {
      .error-page { padding: 40px 20px; }
      .error-ring { 
      width: 100px; 
      height: 100px; 
      }
    }
  </style>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="hero-section">
    <div class="header-inner">
      <a href="index.html" class="initial"><span>PJr</span></a>
      <nav>
        <a href="index.html" class="menu-toggle" style="text-decoration:none; font-size:0.85rem; font-family:'Space Mono',monospace;">
          <i class="fas fa-arrow-left"></i> Back
        </a>
      </nav>
    </div>
  </header>

  <!-- ===== 404 CONTENT ===== -->
  <main class="error-page">
    <div class="error-inner">

      <div class="error-ring">
        <i class="fas fa-satellite-dish"></i>
      </div>

      <p class="error-code">404</p>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-sub">
        Looks like this page went on vacation.<br>
        The URL <span>you entered</span> doesn't exist on this site.
      </p>

      <div class="error-actions">
        <a href="index.html" class="btn-primary">
          <i class="fas fa-house"></i> Back to Home
        </a>
        <a href="index.html#contact" class="btn-secondary">
          <i class="fas fa-envelope"></i> Contact Me
        </a>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-logo">Prince Jr</p>
      <p class="footer-copy">&copy; 2026 PJr — All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
